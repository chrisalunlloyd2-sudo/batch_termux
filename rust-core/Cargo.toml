[package]
name = "batch_termux_core"
version = "0.1.0"
edition = "2021"
description = "Rust native core for batch_termux — PTY multiplexer, resource monitor, heartbeat pacer, regex hooks"

[lib]
name = "batch_rust"
crate-type = ["cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
