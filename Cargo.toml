[package]
name = "batch_termux"
version = "0.1.0"
edition = "2021"
description = "Persistent batch terminal for Termux — Rust native core with psutil monitoring, regex hooks, error recursion feedback, and resource pressure pacing"

[lib]
name = "batch_rust"
crate-type = ["cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
